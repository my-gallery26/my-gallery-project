<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery</title>
<style>
body{margin:0;font-family:sans-serif;background:#f8f8f8}
header{background:white;padding:20px;text-align:center;box-shadow:0 2px 10px #0001}
h1{margin:0;font-size:32px}
p{color:#666}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:16px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card p{padding:10px;margin:0;text-align:center}
@media(min-width:700px){.gallery{grid-template-columns:1fr 1fr 1fr 1fr}}
</style>
</head>
<body>
<header><h1>My Gallery</h1><p>A curated collection - nature, city & everyday beauty</p></header>
<div class="gallery">
<div class="card"><img src="images/01_sunset-1.jpg"><p>Sunset by the Sea 🌅</p></div>
<div class="card"><img src="images/02_daisy.jpg"><p>Daisy 🌼</p></div>
<div class="card"><img src="images/03_city.jpg"><p>City Sunset 🌇</p></div>
<div class="card"><img src="images/04_cat.jpg"><p>Cute Cat 🐱</p></div>
<div class="card"><img src="images/07_pink_roses.jpg"><p>Pink Roses 🌸</p></div>
<div class="card"><img src="images/08_beach.jpg"><p>Beach 🏖️</p></div>
</div>
</body>
</html>
